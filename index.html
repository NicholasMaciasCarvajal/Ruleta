<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de la Suerte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación suave para el modal del ganador */
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* Sombras personalizadas para la ruleta */
        .ruleta-container {
            position: relative;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.1));
        }
        /* Flecha indicadora */
        .ruleta-pointer {
            position: absolute;
            top: 50%;
            right: -10px; /* Apunta desde la derecha */
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-right: 25px solid #ef4444; /* Color rojo de Tailwind */
            z-index: 10;
            filter: drop-shadow(-2px 2px 2px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans selection:bg-indigo-200">

    <div class="max-w-6xl mx-auto p-4 md:p-8 min-h-screen flex flex-col md:flex-row gap-8 items-center justify-center">
        
        <!-- Panel Lateral: Configuración de Opciones -->
        <div class="w-full md:w-1/3 bg-white rounded-3xl shadow-xl p-6 flex flex-col h-[80vh] max-h-[600px]">
            <div class="mb-4">
                <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">Tu Ruleta</h1>
                <p class="text-slate-500 text-sm">Añade o elimina opciones. La ruleta se actualizará automáticamente.</p>
            </div>

            <!-- Formulario para añadir -->
            <form id="add-form" class="flex gap-2 mb-4">
                <input type="text" id="new-option" placeholder="Nueva opción..." class="flex-1 px-4 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" autocomplete="off" required>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-2 w-12 h-12 rounded-xl transition flex items-center justify-center shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </form>

            <!-- Lista de opciones (Scrollable) -->
            <div class="flex-1 overflow-y-auto pr-2 space-y-2 custom-scrollbar" id="options-list">
                <!-- Se inyectan dinámicamente -->
            </div>
        </div>

        <!-- Contenedor Principal: La Ruleta -->
        <div class="w-full md:w-2/3 flex flex-col items-center justify-center">
            
            <div class="ruleta-container w-[320px] h-[320px] sm:w-[400px] sm:h-[400px] md:w-[500px] md:h-[500px] relative mb-8">
                <!-- Flecha indicadora a la derecha -->
                <div class="ruleta-pointer"></div>
                <!-- Canvas de la Ruleta -->
                <canvas id="wheel" width="1000" height="1000" class="w-full h-full rounded-full transition-transform"></canvas>
                
                <!-- Botón central decorativo -->
                <div class="absolute inset-0 m-auto w-12 h-12 md:w-16 md:h-16 bg-white rounded-full shadow-inner flex items-center justify-center border-4 border-slate-100 z-0">
                    <div class="w-4 h-4 bg-slate-300 rounded-full"></div>
                </div>
            </div>

            <button id="spin-btn" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-2xl font-black py-4 px-12 rounded-full shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                ¡GIRAR!
            </button>
        </div>
    </div>

    <!-- Modal de Ganador (Oculto por defecto) -->
    <div id="winner-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white p-8 md:p-12 rounded-[2rem] shadow-2xl max-w-sm w-full text-center mx-4 transform scale-95 transition-transform duration-300" id="winner-card">
            <div class="text-5xl mb-4">🎉</div>
            <h2 class="text-xl font-semibold text-slate-500 mb-2">¡Tenemos un ganador!</h2>
            <p id="winner-text" class="text-4xl font-black text-indigo-600 mb-8 break-words"></p>
            <button onclick="closeWinnerModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-6 rounded-xl transition">
                Cerrar y seguir jugando
            </button>
        </div>
    </div>

    <script>
        // Estado inicial de las opciones
        let options = [
            "Pizza", "Hamburguesa", "Sushi", "Tacos", 
            "Ensalada", "Pasta", "Comida China"
        ];

        // Paleta de colores vibrantes generada dinámicamente
        const getColors = (count) => {
            const colors = [];
            for (let i = 0; i < count; i++) {
                // Genera colores HSL distribuidos uniformemente a lo largo del espectro
                colors.push(`hsl(${(i * 360) / count}, 75%, 60%)`);
            }
            return colors;
        };

        // Elementos del DOM
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const optionsListEl = document.getElementById('options-list');
        const addForm = document.getElementById('add-form');
        const newOptionInput = document.getElementById('new-option');
        const spinBtn = document.getElementById('spin-btn');
        const winnerModal = document.getElementById('winner-modal');
        const winnerCard = document.getElementById('winner-card');
        const winnerText = document.getElementById('winner-text');

        // Variables de la física de la ruleta
        let currentAngle = 0;
        let isSpinning = false;
        let spinAnimation;

        // --- RENDERIZADO DE LA UI ---

        // Renderiza la lista de opciones en el panel lateral
        function renderOptionsList() {
            optionsListEl.innerHTML = '';
            
            if (options.length === 0) {
                optionsListEl.innerHTML = '<p class="text-slate-400 text-center py-4 italic">No hay opciones. ¡Añade algunas!</p>';
                drawWheel();
                return;
            }

            options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100 shadow-sm';
                
                const span = document.createElement('span');
                span.className = 'font-medium text-slate-700 truncate mr-2';
                span.textContent = opt;

                const delBtn = document.createElement('button');
                delBtn.className = 'text-red-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50 transition';
                delBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                delBtn.onclick = () => removeOption(index);

                div.appendChild(span);
                div.appendChild(delBtn);
                optionsListEl.appendChild(div);
            });

            drawWheel();
        }

        // --- LÓGICA DE DATOS ---

        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = newOptionInput.value.trim();
            if (val && !isSpinning) {
                options.push(val);
                newOptionInput.value = '';
                renderOptionsList();
            }
        });

        function removeOption(index) {
            if (isSpinning) return;
            options.splice(index, 1);
            renderOptionsList();
        }

        // --- RENDERIZADO DE LA RULETA (CANVAS) ---

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (options.length === 0) {
                // Dibujar un círculo vacío si no hay opciones
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e2e8f0';
                ctx.fill();
                ctx.font = 'bold 50px sans-serif';
                ctx.fillStyle = '#94a3b8';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Añade opciones', centerX, centerY);
                return;
            }

            const arc = (2 * Math.PI) / options.length;
            const colors = getColors(options.length);

            for (let i = 0; i < options.length; i++) {
                const angle = currentAngle + i * arc;

                // Dibujar la porción (slice)
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, angle, angle + arc, false);
                ctx.lineTo(centerX, centerY);
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                // Borde de la porción
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Dibujar el texto
                ctx.save();
                // Trasladar al centro, rotar al medio de la porción y mover hacia el borde
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 45px sans-serif';
                
                // Sombra para el texto para mayor legibilidad
                ctx.shadowColor = "rgba(0,0,0,0.3)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                const text = options[i].length > 18 ? options[i].substring(0, 18) + '...' : options[i];
                ctx.fillText(text, radius - 40, 0);
                ctx.restore();
            }
        }

        // --- LÓGICA DE GIRO (FÍSICA Y ANIMACIÓN) ---

        // Función de aceleración/desaceleración (Easing: easeOutQuart)
        function easeOutQuart(t, b, c, d) {
            return -c * ((t = t / d - 1) * t * t * t - 1) + b;
        }

        spinBtn.addEventListener('click', () => {
            if (isSpinning || options.length === 0) return;
            
            isSpinning = true;
            spinBtn.disabled = true;

            // Variables de la animación
            const spinDuration = 4000 + Math.random() * 2000; // Entre 4 y 6 segundos
            const minSpins = 5; // Vueltas mínimas
            // Destino aleatorio en radianes
            const totalRotation = (minSpins * 2 * Math.PI) + (Math.random() * 2 * Math.PI);
            
            const startAngleTemp = currentAngle;
            const startTime = performance.now();

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                
                if (elapsed < spinDuration) {
                    // Calcular el ángulo actual basado en la función de easing
                    currentAngle = easeOutQuart(elapsed, startAngleTemp, totalRotation, spinDuration);
                    drawWheel();
                    spinAnimation = requestAnimationFrame(animateSpin);
                } else {
                    // Finalizar el giro
                    currentAngle = startAngleTemp + totalRotation;
                    // Mantener currentAngle entre 0 y 2PI para evitar números gigantes con el tiempo
                    currentAngle = currentAngle % (2 * Math.PI); 
                    drawWheel();
                    isSpinning = false;
                    spinBtn.disabled = false;
                    determineWinner();
                }
            }

            spinAnimation = requestAnimationFrame(animateSpin);
        });

        function determineWinner() {
            // La flecha está en el ángulo 0 (derecha del círculo, 3 en punto).
            // Tenemos que calcular qué segmento se encuentra en ese ángulo.
            
            // 1. Normalizar el ángulo actual a un valor positivo
            const normalizedAngle = currentAngle % (2 * Math.PI);
            
            // 2. Dado que el círculo gira en sentido horario, los índices van en sentido antihorario
            // respecto al ángulo inicial.
            const arc = (2 * Math.PI) / options.length;
            
            // Ángulo offset (qué tanto giró respecto al segmento 0 en la posición 0)
            const offsetAngle = (2 * Math.PI) - normalizedAngle;
            
            // Encontrar el índice del ganador
            const winningIndex = Math.floor(offsetAngle / arc) % options.length;

            showWinnerModal(options[winningIndex]);
        }

        // --- LÓGICA DEL MODAL ---

        function showWinnerModal(winner) {
            winnerText.textContent = winner;
            winnerModal.classList.remove('hidden');
            // Timeout para permitir que el display:block se aplique antes de la transición de opacidad
            setTimeout(() => {
                winnerModal.classList.remove('opacity-0');
                winnerModal.classList.add('opacity-100');
                winnerCard.classList.remove('scale-95');
                winnerCard.classList.add('scale-100', 'pop-in');
            }, 10);
            
            // Pequeño efecto de confeti básico (opcional, simulado moviendo cosas o simplemente UI colorida)
        }

        function closeWinnerModal() {
            winnerModal.classList.remove('opacity-100');
            winnerModal.classList.add('opacity-0');
            winnerCard.classList.remove('scale-100', 'pop-in');
            winnerCard.classList.add('scale-95');
            
            setTimeout(() => {
                winnerModal.classList.add('hidden');
            }, 300); // Igual a la duración de la transición en Tailwind
        }

        // Inicialización
        renderOptionsList();

    </script>
</body>
</html>
